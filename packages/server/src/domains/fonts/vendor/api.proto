syntax = "proto3";

package api_interface;

message InputTemplate {
    bytes input = 1; // ttf/woff2 file buffer
    optional string out_dir = 2; // directory for the split output files

    // ====== Build artifact options ======

    optional CssProperties css = 5; // CSS config
    optional string target_type = 6; // target type
    repeated bytes subsets = 7; // subsets
    optional int32 chunk_size = 9; // chunk size
    optional float chunk_size_tolerance = 10; // chunk size tolerance
    optional int32 max_allow_subsets_count = 11; // max allowed subset count

    optional bool test_html = 13; // whether to generate test HTML
    optional bool reporter = 14; // whether to generate reporter.bin
    optional PreviewImage preview_image = 15; // preview image

    optional string rename_output_font = 18; // rename output font
    optional string build_mode = 20; // TODO build mode

    // ====== Pre-chunking optimization options =======

    optional bool language_areas = 8; // whether to optimize by language areas
    optional bool multi_threads = 21; // TODO whether to use multiple threads
    optional bool font_feature = 22; // whether to enable font features
    optional bool reduce_mins = 23; // whether to reduce the minimum chunk count
    optional bool auto_subset = 24; // whether to auto-subset
    optional bool subset_remain_chars = 25; // whether to automatically add undeclared chars

    // CSS properties config
    message CssProperties {
        optional string font_family = 1; // font family name
        optional string font_weight = 2; // font weight
        optional string font_style = 3; // font style
        optional string font_display = 4; // font display
        repeated string local_family = 5; // local font family names
        repeated PolyfillType polyfill = 6; // polyfill types

        // comment properties

        optional bool comment_base = 11; // base comment
        optional bool comment_name_table = 12; // name table comment
        optional bool comment_unicodes = 13; // Unicode comment
        optional bool compress = 8; // whether to compress
        optional string file_name = 9; // file name
    }

    // polyfill type
    message PolyfillType {
        string name = 1; // name
        string format = 2; // format
    }

    // preview image
    message PreviewImage {
        string text = 1; // text shown in the svg
        string name = 2; // name of the svg file
    }
}

enum EventName {
  UNSPECIFIED = 0;
  OUTPUT_DATA = 1; // "output_data"
  END = 2;         // "end"
}

message EventMessage {
    EventName event = 1;
    string message = 2;
    optional bytes data = 3;
}
message MultiMessages {
    repeated EventMessage messages = 1;
}
message OutputReport {
    string version = 1; // version
    Css css = 2; // CSS info, ready to use directly
    string platform = 3; // platform info — the platform rust built on

    BundleMessage bundle_message = 24; // build message
    repeated NameTable name_table = 25; // name table info
    repeated SubsetDetail subset_detail = 26; // subset details

    message NameTable {
        string platform = 1; // platform
        string language = 2; // language
        string name = 3; // name
        string value = 4; // value
    }

    message SubsetDetail {
        uint32 id = 1; // ID
        string hash = 2; // hash
        string file_name = 6; // file name
        uint32 bytes = 3; // byte count
        repeated uint32 chars = 4; // char array
        uint32 duration = 5; // build duration
    }

    message BundleMessage {
        uint32 origin_size = 1; // original size
        uint32 bundled_size = 2; // bundled size
        uint32 origin_bytes = 3; // original bytes
        uint32 bundled_bytes = 4; // bundled bytes
    }

    message Css {
        string family = 1; // font family
        string style = 2; // style
        string weight = 3; // weight
        string display = 4; // display
    }
}
