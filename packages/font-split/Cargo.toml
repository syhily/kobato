[package]
name = "kobato-font-split"
description = "Fork of KonghaYao/cn-font-split (release @ 1650af13): protobuf removed, trimmed to the Kobato font slicing pipeline, packaged as a Node-API addon."
version = "7.4.3"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
bench = []

[dependencies]
harfbuzz_rs_now = "2.3.2"
log = "0.4.35"
md5 = "0.8.1"
opentype = "0.39.1"
rayon = "1.10.0"
woff = "0.6.4"
chrono = { version = "0.4.45", default-features = false, features = ["std", "now"] }
indexmap = "2.14.2"
napi = { version = "3.16.3", features = ["napi10", "async"] }
napi-derive = "3.7.2"

[build-dependencies]
napi-build = "2.7.0"

[dev-dependencies]
harfbuzz_rs_now = "2.3.2"
indexmap = "2.14.2"
opentype = "0.39.1"
woff = "0.6.4"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
