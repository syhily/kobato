  '@codemirror/view': 6.43.4

# Peer-version acceptances for packages that lag this repo's stack:
#
# - @emnapi/core / @emnapi/runtime '1': @napi-rs/wasm-runtime@1.2.0 peers on
#   2.0.0-alpha.3, but the only consumers are wasm32-wasi FALLBACK bindings
#   (oxc-parser, oxc-resolver, rolldown) that never execute here — every
#   dev/CI platform runs the native binding. The stable 1.x line that the
#   rest of the tree already uses is accepted.
peerDependencyRules:
  allowedVersions:
    '@emnapi/core': '1'
    '@emnapi/runtime': '1'
