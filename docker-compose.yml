name: kobato

# The whole product is one container: the content database (SQLite) and
# the analytics sidecar (DuckDB) are embedded files on the kobato_data
# volume — no database service, no internal network.

services:
  app:
    image: ghcr.io/syhily/kobato:latest
    ports:
      - '${PORT:-4321}:${PORT:-4321}'
    environment:
      # Server
      NODE_ENV: production
      server__host: ${HOST:-0.0.0.0}
      server__port: ${PORT:-4321}
      # Security
      security__sessionSecret: ${SESSION_SECRET:?SESSION_SECRET is required}
      security__encryptionKey: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      # Logging
      server__loggingLevel: ${LOG_LEVEL:-info}
      # Data directory (SQLite + DuckDB files, fonts, uploads staging)
      storage__data: /data
      storage__database: /data/kobato.db
      storage__analyticsDatabase: /data/analytics.duckdb
    volumes:
      - kobato_data:/data
      - kobato_config:/etc/kobato
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

volumes:
  kobato_data:
  kobato_config:
