# Peer-version acceptances inherited from the former inkling sub-package
# (now src/inkling — the deps below are direct root dependencies):
#
# - @emnapi/core / @emnapi/runtime '1': @napi-rs/wasm-runtime@1.2.0 peers on
#   2.0.0-alpha.3, but the only consumers are wasm32-wasi FALLBACK bindings
#   (oxc-parser, oxc-resolver, rolldown) that never execute here — every
#   dev/CI platform runs the native binding. The stable 1.x line that the
#   rest of the tree already uses is accepted.
# - oxc-transform-react '^0.145.0': @vitejs/plugin-react@6.1.1's peer range
#   lags the 0.x line (^0.145.0 excludes 0.148.0 under 0.x caret semantics).
#   The catalog pins 0.148.0 — the same binding the root react-compiler
#   plugin uses; the transform API surface the plugin touches is unchanged.
peerDependencyRules:
  allowedVersions:
    '@emnapi/core': '1'
    '@emnapi/runtime': '1'
    oxc-transform-react: '^0.157.0'
permissions:
  drizzle-kit:
    skills: true
  taze:
    skills: true
