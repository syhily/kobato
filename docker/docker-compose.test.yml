name: kobato-test

services:
  postgres-test:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - '5434:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'test']
      interval: 5s
      timeout: 3s
      retries: 5
