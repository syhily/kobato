name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + typecheck + test + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      security__sessionSecret: ci-session-secret-not-a-real-one
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm run type
      - run: pnpm run fmt:check
      - run: pnpm run lint
      - name: standalone editor playground
        run: |
          pnpm exec tsc -p apps/inkling-demo/tsconfig.json
          pnpm exec vite build apps/inkling-demo
      - run: pnpm run test -- --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
        if: always()

  build:
    name: production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        if: github.event_name != 'pull_request'
      - run: command -v patchelf >/dev/null || sudo apt-get install -y patchelf
        if: github.event_name == 'pull_request'
      - run: pnpm run sea:build
        if: github.event_name == 'pull_request'
      - name: production trace/rum bundle guard
        run: |
          test -d apps/kobato/build/client
          test -d apps/kobato/build/server
          pnpm exec vitest run --project app-unit apps/kobato/tests/arch/production-rum-bundle.test.ts
        env:
          KOBATO_REQUIRE_PRODUCTION_BUILD: '1'
      - run: pnpm --filter @kobato/browser exec playwright install --with-deps chromium
        if: github.event_name == 'pull_request'
      - run: pnpm run sea:browser dist-sea/kobato
        if: github.event_name == 'pull_request'
        env:
          KOBATO_BROWSER_CHANNEL: chromium
