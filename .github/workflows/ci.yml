name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same branch so PR pushes don't queue up
# duplicate jobs. Each run still emits a status check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + typecheck + test + coverage
    runs-on: ubuntu-latest
    # 15 min covered the root project alone; the inkling editor suite
    # (tests/inkling, ~350 jsdom files) runs inside `pnpm run test` and
    # needs the headroom.
    timeout-minutes: 20
    env:
      security__sessionSecret: ci-session-secret-not-a-real-one
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run type
      - run: pnpm run fmt:check
      - run: pnpm run lint
      - run: pnpm run test -- --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
        if: always()

  build:
    name: production build
    runs-on: ubuntu-latest
    # PRs also build the SEA binary and run the real-browser journeys; the
    # production build alone (push) is much cheaper. Keep room for
    # react-router + 3 SEA bundles + native injection + Playwright.
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Pushes only need the production build. PRs build the SEA binary for the
      # real-browser journeys; `sea:build` runs `pnpm run build` itself, so the
      # two paths never build twice.
      - run: pnpm run build
        if: github.event_name != 'pull_request'
      - run: command -v patchelf >/dev/null || sudo apt-get install -y patchelf
        if: github.event_name == 'pull_request'
      - run: pnpm run sea:build
        if: github.event_name == 'pull_request'
      # Real-Chromium journeys (tests/browser). CI uses Playwright's bundled
      # Chromium; `sea:browser` forces the built binary, so a missing
      # dist-sea/kobato fails the step instead of silently skipping.
      - run: pnpm exec playwright install --with-deps chromium
        if: github.event_name == 'pull_request'
      - run: pnpm run sea:browser dist-sea/kobato
        if: github.event_name == 'pull_request'
        env:
          KOBATO_BROWSER_CHANNEL: chromium
