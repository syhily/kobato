name: SEA

on:
  workflow_dispatch:
  push:
    branches: [main]
  release:
    types: [created]

# Mirror docker.yml: never cancel — a release build must run to completion.
concurrency:
  group: sea-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    # The deep smoke boots the server against real services; the image must
    # carry pgvector + timescaledb (same as docker/docker-compose.test.yml).
    services:
      postgres:
        image: timescale/timescaledb-ha:pg17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      database__url: postgres://test:test@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # patchelf rewrites the sharp addon's rpath during sea:build (see
      # scripts/sea/assets.ts). Preinstalled on the ubuntu-24.04 runner
      # image — this guards against image changes.
      - run: command -v patchelf >/dev/null || sudo apt-get install -y patchelf
      # Release binaries pack the blob at brotli-11 (smallest; the slower
      # pack is acceptable CI time). Local `sea:build` stays zstd.
      - run: pnpm run sea:build --codec brotli
      - name: Rename output to kobato-<target>
        env:
          BIN: kobato-${{ matrix.target }}
        working-directory: dist-sea
        run: |
          sha256sum -c kobato.sha256
          mv kobato "$BIN"
          rm kobato.sha256
      - run: pnpm run sea:smoke "dist-sea/kobato-${{ matrix.target }}"
      # True HTTP e2e against the SEA-booted instance (tests/e2e). Only on
      # Linux — the darwin/win32 jobs have no Postgres service.
      - run: pnpm run sea:e2e "dist-sea/kobato-${{ matrix.target }}"
      - name: Package tar.gz with checksum
        env:
          BIN: kobato-${{ matrix.target }}
        working-directory: dist-sea
        run: |
          tar -czf "$BIN.tar.gz" "$BIN"
          sha256sum "$BIN.tar.gz" > "$BIN.tar.gz.sha256"
          sha256sum -c "$BIN.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: kobato-${{ matrix.target }}
          retention-days: 7
          path: |
            dist-sea/kobato-${{ matrix.target }}.tar.gz
            dist-sea/kobato-${{ matrix.target }}.tar.gz.sha256

  # macOS targets: separate job because GitHub service containers (the
  # Postgres the deep smoke boots against) only run on Linux. The
  # macOS smoke is therefore binary-only (--version / --smoke-natives /
  # --smoke-worker); the full server lifecycle stays covered by the Linux
  # targets above.
  build-darwin:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run sea:build --codec brotli
      - name: Rename output to kobato-<target>
        env:
          BIN: kobato-${{ matrix.target }}
        working-directory: dist-sea
        # macOS has no sha256sum; shasum -a 256 is flag-compatible.
        run: |
          shasum -a 256 -c kobato.sha256
          mv kobato "$BIN"
          rm kobato.sha256
      - run: pnpm run sea:smoke --binary-only "dist-sea/kobato-${{ matrix.target }}"
      - name: Package tar.gz with checksum
        env:
          BIN: kobato-${{ matrix.target }}
        working-directory: dist-sea
        run: |
          tar -czf "$BIN.tar.gz" "$BIN"
          shasum -a 256 "$BIN.tar.gz" > "$BIN.tar.gz.sha256"
          shasum -a 256 -c "$BIN.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: kobato-${{ matrix.target }}
          retention-days: 7
          path: |
            dist-sea/kobato-${{ matrix.target }}.tar.gz
            dist-sea/kobato-${{ matrix.target }}.tar.gz.sha256

  # Windows targets: same split as macOS — the deep smoke needs Linux
  # service containers, and Windows runners can only run Windows
  # containers, so the smoke is binary-only here too. The rename/package
  # steps run under Git Bash (sha256sum/tar); the binary is kobato.exe.
  build-windows:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: win32-x64
          - os: windows-11-arm
            target: win32-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run sea:build --codec brotli
      - name: Rename output to kobato-<target>
        env:
          BIN: kobato-${{ matrix.target }}
        working-directory: dist-sea
        shell: bash
        run: |
          sha256sum -c kobato.sha256
          mv kobato.exe "$BIN.exe"
          rm kobato.sha256
      - run: pnpm run sea:smoke --binary-only "dist-sea/kobato-${{ matrix.target }}.exe"
      - name: Package tar.gz with checksum
        env:
          BIN: kobato-${{ matrix.target }}
        working-directory: dist-sea
        shell: bash
        run: |
          tar -czf "$BIN.tar.gz" "$BIN.exe"
          sha256sum "$BIN.tar.gz" > "$BIN.tar.gz.sha256"
          sha256sum -c "$BIN.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: kobato-${{ matrix.target }}
          retention-days: 7
          path: |
            dist-sea/kobato-${{ matrix.target }}.tar.gz
            dist-sea/kobato-${{ matrix.target }}.tar.gz.sha256

  # Release assets are uploaded only for release events, in a separate job
  # so the elevated contents:write token never reaches the build matrix.
  release-upload:
    name: upload release assets
    if: github.event_name == 'release'
    needs: [build, build-darwin, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: kobato-*
          path: dist-sea
          merge-multiple: true
      - name: Upload binaries to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist-sea/kobato-* --clobber
