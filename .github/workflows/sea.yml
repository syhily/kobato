name: SEA

on:
  workflow_dispatch:
  push:
    branches: [develop]
    tags: ['*']
  pull_request:
    branches: [main, develop]
  release:
    types: [created]

concurrency:
  group: sea-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            timeout: 30
            deep-verify: true
            deb: true
            artifacts: |
              dist-sea/kobato-linux-x64.tar.gz
              dist-sea/kobato-linux-x64.tar.gz.sha256
              dist-sea/kobato-linux-x64.sha256
              dist-sea/kobato_*_amd64.deb
              dist-sea/kobato_*_amd64.deb.sha256
          - os: ubuntu-24.04-arm
            target: linux-arm64
            timeout: 30
            deep-verify: true
            artifacts: |
              dist-sea/kobato-linux-arm64.tar.gz
              dist-sea/kobato-linux-arm64.tar.gz.sha256
              dist-sea/kobato-linux-arm64.sha256
          - os: macos-15
            target: darwin-arm64
            timeout: 45
            artifacts: |
              dist-sea/kobato-darwin-arm64.tar.gz
              dist-sea/kobato-darwin-arm64.tar.gz.sha256
              dist-sea/kobato-darwin-arm64.sha256
          - os: windows-2025
            target: win32-x64
            timeout: 45
            exe: .exe
            artifacts: |
              dist-sea/kobato-win32-x64.tar.gz
              dist-sea/kobato-win32-x64.tar.gz.sha256
              dist-sea/kobato-win32-x64.sha256
          - os: windows-11-arm
            target: win32-arm64
            timeout: 45
            exe: .exe
            artifacts: |
              dist-sea/kobato-win32-arm64.tar.gz
              dist-sea/kobato-win32-arm64.tar.gz.sha256
              dist-sea/kobato-win32-arm64.sha256
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
      - run: pnpm install --frozen-lockfile
      - run: command -v patchelf >/dev/null || sudo apt-get install -y patchelf
        if: runner.os == 'Linux'
      - run: pnpm run sea:build
      - name: Rename output to kobato-<target>
        run: pnpm run sea:package rename --target ${{ matrix.target }}
      - run: pnpm run sea:smoke "dist-sea/kobato-${{ matrix.target }}${{ matrix.exe }}"
      - run: pnpm run sea:e2e "dist-sea/kobato-${{ matrix.target }}${{ matrix.exe }}"
        if: matrix.deep-verify
      - run: pnpm --filter @kobato/browser exec playwright install --with-deps chromium
        if: matrix.deep-verify
      - run: pnpm run sea:browser "dist-sea/kobato-${{ matrix.target }}${{ matrix.exe }}"
        if: matrix.deep-verify
        env:
          KOBATO_BROWSER_CHANNEL: chromium
      - name: Package tar.gz with checksum
        run: pnpm run sea:package archive --target ${{ matrix.target }}
      - name: Package Ubuntu x64 deb with checksum
        run: pnpm run sea:package archive --target ${{ matrix.target }} --deb
        if: matrix.deb
      - uses: actions/upload-artifact@v7
        with:
          name: kobato-${{ matrix.target }}
          retention-days: 7
          path: ${{ matrix.artifacts }}

  build-verification:
    name: build (linux-x64, verification)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
      - run: pnpm install --frozen-lockfile
      - run: command -v patchelf >/dev/null || sudo apt-get install -y patchelf
      - run: pnpm run sea:build
      - run: pnpm run sea:smoke dist-sea/kobato
      - run: pnpm run sea:e2e dist-sea/kobato
      - run: pnpm --filter @kobato/browser exec playwright install --with-deps chromium
      - run: pnpm run sea:browser dist-sea/kobato
        env:
          KOBATO_BROWSER_CHANNEL: chromium

  release-upload:
    name: upload release assets
    if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: kobato-*
          path: dist-sea
          merge-multiple: true
      - name: Upload packages to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.ref_name }}" dist-sea/kobato-* dist-sea/kobato_*_amd64.deb dist-sea/kobato_*_amd64.deb.sha256 --clobber
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
      - name: Remove assets from older releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          current_created_at="$(gh release view "$CURRENT_TAG" --json createdAt --jq .createdAt)"
          asset_ids="$(
            CURRENT_CREATED_AT="$current_created_at" gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
              --jq '.[] | select(.created_at < env.CURRENT_CREATED_AT) | .assets[].id'
          )"
          for asset_id in $asset_ids; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$asset_id"
          done
      - name: Delete uploaded build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[].id')"
          for id in $ids; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id"
          done
