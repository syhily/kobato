name: Docker

on:
  push:
    branches: [main]
  release:
    types: [created]

# Prevent concurrent builds on main to avoid race conditions when pushing latest.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: build and push image
    runs-on: ubuntu-latest
    # Multi-arch: the arm64 leg runs under QEMU emulation, so the whole
    # SEA build (pnpm install + vite bundles + brotli-11 packing) is
    # several times slower than a native build. If this becomes painful,
    # switch to per-arch native runners (ubuntu-24.04-arm, like sea.yml)
    # pushing by digest, plus a manifest-merge job.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}

      # QEMU provides the arm64 emulator for the multi-platform build;
      # buildx then runs the Dockerfile once per listed platform.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          # amd64 + arm64: sea.yml already ships linux-arm64 binaries, so
          # the image must not strand ARM Docker hosts with exec format
          # errors.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
