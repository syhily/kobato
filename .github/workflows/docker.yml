name: Docker

on:
  push:
    branches: [main]
  release:
    # `published` is what the automated flow produces: sea.yml's
    # release-upload job flips the draft public after uploading the SEA
    # assets. `created` covers manual non-draft releases. GitHub fires NO
    # workflow events for draft releases, so a `created`-only trigger
    # never fires in the automated flow.
    types: [created, published]

# Prevent concurrent builds on main to avoid race conditions when pushing latest.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: build and push image
    runs-on: ubuntu-latest
    # GitHub fires no workflow events for draft releases, so this job only
    # ever runs for non-draft releases; the `!draft` guard stays as a
    # belt-and-suspenders check — a discarded draft must never leave
    # semver-tagged images behind on the registry. (On push events
    # `github.event.release` is null and this passes.)
    if: ${{ !github.event.release.draft }}
    # Multi-arch: the arm64 leg runs under QEMU emulation, so the whole
    # SEA build (pnpm install + vite bundles + brotli-11 packing) is
    # several times slower than a native build. If this becomes painful,
    # switch to per-arch native runners (ubuntu-24.04-arm, like sea.yml)
    # pushing by digest, plus a manifest-merge job.
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}

      # QEMU provides the arm64 emulator for the multi-platform build;
      # buildx then runs the Dockerfile once per listed platform.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # The build publishes under a staging tag FIRST, never under the
      # user-facing tags: the smoke below gates `latest` / semver, so a
      # broken image can no longer ship and then fail. The staging tag
      # (`build-<sha>`) stays on the registry as build provenance — it is
      # untagged by convention from any release channel, and the prune
      # step at the bottom keeps only the newest few of them (audit
      # P2-16: ghcr has no built-in retention).
      - uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          # amd64 + arm64: sea.yml already ships linux-arm64 binaries, so
          # the image must not strand ARM Docker hosts with exec format
          # errors.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:build-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The arm64 leg is built entirely under QEMU and the image's
      # HEALTHCHECK only probes /health — the embedded native libraries
      # (sharp / canvas / duckdb) never load there, so an arch-broken
      # natives bundle would ship unnoticed. Pull the just-pushed staging
      # manifest back and run the SEA binary's own zero-config smoke flags
      # inside the container per platform (arm64 via the QEMU binfmt
      # above) — BEFORE any user-facing tag exists.
      - name: Smoke the SEA binary inside the image
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          for arch in amd64 arm64; do
            docker run --rm --platform "linux/$arch" --entrypoint kobato "$IMAGE" --version
            docker run --rm --platform "linux/$arch" --entrypoint kobato "$IMAGE" --smoke-natives
          done

      # Smoke passed — point the release tags at the very same manifest
      # (no rebuild, no digest drift).
      - name: Tag the smoked image
        env:
          IMAGE: ghcr.io/${{ github.repository }}:build-${{ github.sha }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE"

      - uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Every main push leaves a `build-<sha>` staging tag behind, and ghcr
      # has no built-in retention — prune them via the API (audit P2-16).
      # Once the user-facing tags move on to a newer build, an old staging
      # version carries only `build-*` tags and becomes prunable; versions
      # still holding `latest` / semver tags are never touched (deleting a
      # version deletes ALL its tags). The newest 10 staging versions stay
      # as build provenance. Best-effort: a prune failure must not fail a
      # release, so this runs continue-on-error.
      - name: Prune old build-* staging tags
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          package="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          if [ "$(gh api "users/$owner" --jq .type)" = "Organization" ]; then
            base="orgs/$owner"
          else
            base="users/$owner"
          fi
          # Sort explicitly by created_at — the "keep the newest 10"
          # window must not depend on the API's undocumented default
          # ordering (fix-review).
          gh api --paginate --slurp "$base/packages/container/$package/versions?per_page=100" \
            --jq '[ add[] | select((.metadata.container.tags | length > 0) and ([.metadata.container.tags[] | startswith("build-")] | all)) ] | sort_by(.created_at) | reverse | .[10:][] | .id' \
          | while read -r id; do
              echo "Deleting staging version $id"
              gh api -X DELETE "$base/packages/container/$package/versions/$id"
            done
