name: Docker

on:
  push:
    branches: [main]
  release:
    # `published` is what the automated flow produces: sea.yml's
    # release-upload job flips the draft public after uploading the SEA
    # assets. `created` covers manual non-draft releases. GitHub fires NO
    # workflow events for draft releases, so a `created`-only trigger
    # never fires in the automated flow.
    types: [created, published]

# Prevent concurrent builds on main to avoid race conditions when pushing latest.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Per-arch native builds. The arm64 leg used to run the whole SEA build
  # under QEMU emulation, which never fit the job timeout (6.7.1: 85+
  # minutes without progress inside `pnpm run sea:build` on the emulated
  # leg — rolldown's multithreaded Rust bundling degrades catastrophically
  # under TCG) — so each platform now builds on its own native runner
  # (ubuntu-24.04-arm, same as sea.yml) and pushes an arch-scoped staging
  # tag. The merge job below assembles the multi-arch manifest.
  build:
    name: build linux/${{ matrix.arch }} and smoke
    runs-on: ${{ matrix.runner }}
    # GitHub fires no workflow events for draft releases, so this job only
    # ever runs for non-draft releases; the `!draft` guard stays as a
    # belt-and-suspenders check — a discarded draft must never leave
    # semver-tagged images behind on the registry. (On push events
    # `github.event.release` is null and this passes.)
    if: ${{ !github.event.release.draft }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # Labels only on the per-arch images — the user-facing tags are
          # applied to the merged manifest by the merge job below.
          tags: |
            type=raw,value=build-${{ github.sha }}-${{ matrix.arch }}

      - uses: docker/setup-buildx-action@v4

      # Each arch pushes its own staging tag FIRST. The smoke below gates
      # the merge, so a broken image can no longer ship and then fail —
      # the staging tags stay on the registry as build provenance.
      - uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # Native smoke on the arch's own runner: the embedded native
      # libraries (sharp / canvas / duckdb) load without emulation, so
      # `--smoke-natives` genuinely exercises the bundle per arch — the
      # old QEMU-based smoke of the arm64 leg never ran these.
      - name: Smoke the SEA binary inside the image
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
        run: |
          docker pull "$IMAGE"
          docker run --rm --platform linux/${{ matrix.arch }} --entrypoint kobato "$IMAGE" --version
          docker run --rm --platform linux/${{ matrix.arch }} --entrypoint kobato "$IMAGE" --smoke-natives

  merge:
    name: merge multi-arch manifest and tag
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}

      # Both per-arch staging tags passed their native smoke — point the
      # combined staging tag and the user-facing tags at one manifest list
      # referencing them (no rebuild, no digest drift).
      - name: Merge the per-arch manifests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=(-t "$IMAGE:build-${{ github.sha }}")
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(-t "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" \
            "$IMAGE:build-${{ github.sha }}-amd64" \
            "$IMAGE:build-${{ github.sha }}-arm64"

      - name: Resolve the merged digest
        id: merged
        env:
          IMAGE: ghcr.io/${{ github.repository }}:build-${{ github.sha }}
        run: echo "digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

      - uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.merged.outputs.digest }}
          push-to-registry: true

      # Every main push leaves `build-<sha>` staging manifests behind, and
      # ghcr has no built-in retention — prune them via the API (audit
      # P2-16). The per-arch staging versions (`build-<sha>-amd64` /
      # `-arm64`) are NEVER pruned: the merged manifest lists reference
      # them by digest, so deleting one would break every semver image
      # that still points at it. Versions still holding `latest` / semver
      # tags are never touched either (deleting a version deletes ALL its
      # tags). The newest 10 staging manifests stay as build provenance.
      # Best-effort: a prune failure must not fail a release, so this runs
      # continue-on-error.
      - name: Prune old build-* staging tags
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%/*}"
          package="$(echo "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')"
          if [ "$(gh api "users/$owner" --jq .type)" = "Organization" ]; then
            base="orgs/$owner"
          else
            base="users/$owner"
          fi
          # Sort explicitly by created_at — the "keep the newest 10"
          # window must not depend on the API's undocumented default
          # ordering (fix-review). Arch-scoped staging tags are excluded
          # from pruning (see above).
          gh api --paginate --slurp "$base/packages/container/$package/versions?per_page=100" \
            --jq '[ add[] | select((.metadata.container.tags | length > 0) and ([.metadata.container.tags[] | startswith("build-")] | all) and ([.metadata.container.tags[] | test("build-.*-(amd64|arm64)$")] | any | not)) ] | sort_by(.created_at) | reverse | .[10:][] | .id' \
          | while read -r id; do
              echo "Deleting staging version $id"
              gh api -X DELETE "$base/packages/container/$package/versions/$id"
            done
