[package]
name = "kobato-font-split"
description = "Fork of KonghaYao/cn-font-split (release @ 1650af13): protobuf removed, trimmed to the Kobato font slicing pipeline, packaged as a Node-API addon."
version = "7.6.8"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Data-generation pipeline (ADR-0010): the `corpus` bin (download/build/generate) is gated behind
# this feature so the production addon build and CI never compile these dependencies.
[features]
corpus = ["dep:memchr", "dep:opencc-fmmseg"]

[[bin]]
name = "corpus"
path = "src/bin/corpus/main.rs"
required-features = ["corpus"]

[dependencies]
harfbuzz_rs_now = "2.3.2"
log = "0.4.35"
md5 = "0.8.1"
opentype = "0.39.1"
rayon = "1.10.0" # pinned to 1.10.x: opencc-fmmseg (corpus feature) requires exactly =1.10
woff = "0.6.4"
chrono = { version = "0.4.45", default-features = false, features = ["std", "now"] }
indexmap = "2.14.2"
memchr = { version = "2.8.3", optional = true }
napi = { version = "3.16.3", features = ["napi10", "async"] }
napi-derive = "3.7.2"
opencc-fmmseg = { version = "0.13.1", optional = true }

[build-dependencies]
napi-build = "2.7.0"

[dev-dependencies]
harfbuzz_rs_now = "2.3.2"
indexmap = "2.14.2"
opentype = "0.39.1"
woff = "0.6.4"

[profile.release]
lto = true
